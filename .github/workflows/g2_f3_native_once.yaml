name: F3 native three-format pilot
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/g2_f3_native_once.yaml']
permissions:
  contents: read
  actions: read
concurrency:
  group: nostream-free-f0-once
  cancel-in-progress: false
jobs:
  offline:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - case: F301
            question_type: binary
            source: D01
            evidence_run: 45522593032
          - case: F302
            question_type: multiple_choice
            source: D05
            evidence_run: 45520535838
          - case: F303
            question_type: numeric
            source: D03
            evidence_run: 45522593032
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: No-Stream/nostreambot-metaculus-bot
          ref: 79c1d7a1192a00724646ab05c67f3b776d2d7b65
          path: upstream
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Install pinned engine and local adapter
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "79c1d7a1192a00724646ab05c67f3b776d2d7b65"
          cp research/nostream_runner.py research/nostream_free_f0.py research/nostream_free_f2.py research/nostream_free_f3.py research/g2_diverse_cases.json research/g2_diverse_evidence.py upstream/
          cd upstream
          uv sync --dev --frozen
      - uses: actions/download-artifact@v4
        with:
          name: diverse-${{ matrix.source }}-snapshot
          run-id: ${{ matrix.evidence_run }}
          github-token: ${{ github.token }}
          path: upstream/diverse-input
      - name: Offline snapshot, role, aggregate and budget checks
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: dummy-offline
          NOSTREAM_G2: 'true'
          NOSTREAM_QUESTION_TYPE: ${{ matrix.question_type }}
          NOSTREAM_F3_CASE: ${{ matrix.case }}
          NATIVE_SEARCH_ENABLED: 'false'
          FINANCIAL_DATA_ENABLED: 'false'
          GEMINI_SEARCH_ENABLED: 'false'
          GAP_FILL_ENABLED: 'false'
          GAP_FILL_V2_ENABLED: 'false'
          PREDICTION_MARKETS_ENABLED: 'false'
          RESOLUTION_SOURCE_ENABLED: 'false'
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: 'false'
          TS_ANCHOR_ENABLED: 'false'
          TS_ANCHOR_CHART_ENABLED: 'false'
          PROBABILISTIC_TOOLS_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          NUMERIC_STACKING_ENABLED: 'false'
          PERSIST_RESEARCH_ENABLED: 'false'
          RAW_RESEARCH_LOG_ENABLED: 'false'
        run: uv run --frozen python nostream_free_f3.py
  real:
    needs: offline
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case: F301
            question_type: binary
            source: D01
            evidence_run: 45522593032
          - case: F302
            question_type: multiple_choice
            source: D05
            evidence_run: 45520535838
          - case: F303
            question_type: numeric
            source: D03
            evidence_run: 45522593032
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: No-Stream/nostreambot-metaculus-bot
          ref: 79c1d7a1192a00724646ab05c67f3b776d2d7b65
          path: upstream
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Install pinned engine and local adapter
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "79c1d7a1192a00724646ab05c67f3b776d2d7b65"
          cp research/nostream_runner.py research/nostream_free_f0.py research/nostream_free_f2.py research/nostream_free_f3.py research/g2_diverse_cases.json research/g2_diverse_evidence.py upstream/
          cd upstream
          uv sync --dev --frozen
      - uses: actions/download-artifact@v4
        with:
          name: diverse-${{ matrix.source }}-snapshot
          run-id: ${{ matrix.evidence_run }}
          github-token: ${{ github.token }}
          path: upstream/diverse-input
      - name: One bounded F3 native event trial
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOSTREAM_CEREBRAS_TRIAL_AUTHORIZED: 'true'
          NOSTREAM_CEREBRAS_NO_RECHARGE_ATTESTED: 'true'
          NOSTREAM_F3_LIVE_AUTHORIZED: 'true'
          NOSTREAM_G2: 'true'
          NOSTREAM_QUESTION_TYPE: ${{ matrix.question_type }}
          NOSTREAM_F3_CASE: ${{ matrix.case }}
          NATIVE_SEARCH_ENABLED: 'false'
          FINANCIAL_DATA_ENABLED: 'false'
          GEMINI_SEARCH_ENABLED: 'false'
          GAP_FILL_ENABLED: 'false'
          GAP_FILL_V2_ENABLED: 'false'
          PREDICTION_MARKETS_ENABLED: 'false'
          RESOLUTION_SOURCE_ENABLED: 'false'
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: 'false'
          TS_ANCHOR_ENABLED: 'false'
          TS_ANCHOR_CHART_ENABLED: 'false'
          PROBABILISTIC_TOOLS_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          NUMERIC_STACKING_ENABLED: 'false'
          PERSIST_RESEARCH_ENABLED: 'false'
          RAW_RESEARCH_LOG_ENABLED: 'false'
        run: uv run --frozen python nostream_free_f3.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-native-${{ matrix.case }}-receipt
          path: upstream/free-results/
          if-no-files-found: warn
