name: G3 cross-domain development definitions
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/g3_cross_domain_development.yaml']
permissions:
  contents: read
  actions: read
jobs:
  define:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate: [nao,oil,river]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cross-domain-${{ matrix.candidate }}
          run-id: 45741785164
          github-token: ${{ github.token }}
          path: evidence
      - name: Reuse frozen source receipt and validate resolution arithmetic
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: python3 research/g3_cross_domain_development.py "$CANDIDATE" evidence/cross-domain.json
      - uses: actions/upload-artifact@v4
        with:
          name: cross-domain-definition-${{ matrix.candidate }}
          path: cross-domain-definition.json
          if-no-files-found: error
  reconcile:
    needs: define
    if: always() && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: cross-domain-definition-*
          path: incoming
      - name: Consolidate development definitions without live admission
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          reports={};blocked=[]
          for k in ("nao","oil","river"):
              try:
                  d=json.loads((Path("incoming")/("cross-domain-definition-"+k)/"cross-domain-definition.json").read_bytes())
                  e=d["definition"]
                  assert d["definition_sha256"]==hashlib.sha256(json.dumps(e,sort_keys=True,separators=(",",":"),allow_nan=False).encode()).hexdigest()
                  assert e["partition"]=="development_only" and not e["confirmatory_eligible"] and not e["inference_authorized"] and not e["capture_authorized"]
                  assert d["inference_calls"]==d["actual_outcomes_accessed"]==0
                  reports[k]=d
              except (OSError,ValueError,KeyError,AssertionError):blocked.append(k)
          r={"reports":reports,"blocked":blocked,"confirmatory_pairs":0,"inference_calls":0,"actual_outcomes_accessed":0,"status":"DEVELOPMENT_DEFINITIONS_READY" if not blocked else "PARTIAL_BLOCK"}
          Path("cross-domain-definitions-final.json").write_text(json.dumps(r,sort_keys=True))
          print("CROSS_DOMAIN_DEFINITIONS_FINAL="+json.dumps(r,sort_keys=True))
          if blocked:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-domain-definitions-final
          path: cross-domain-definitions-final.json
          if-no-files-found: error
