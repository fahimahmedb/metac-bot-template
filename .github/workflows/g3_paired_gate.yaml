name: G3 paired scoring gate final-date challenge
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/g3_paired_gate.yaml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 research/g3_paired_gate.py --test
