name: G3 direct Federal Reserve source access
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/g3_primary_source_probe.yaml']
permissions:
  contents: read
jobs:
  source:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        series: [H41,H15]
    steps:
      - name: Verify primary government data only; no model calls
        env:
          SERIES: ${{ matrix.series }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request,urllib.parse
          from datetime import datetime,timezone
          from html.parser import HTMLParser
          from pathlib import Path
          series=os.environ["SERIES"]
          urls={"H41":"https://www.federalreserve.gov/releases/h41/current/h41.htm","H15":"https://www.federalreserve.gov/releases/h15/current/"}
          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__();self.text=[];self.rows=[];self.row=None;self.cell=None
              def handle_starttag(self,tag,attrs):
                  if tag=="tr":self.row=[]
                  elif tag in ("td","th") and self.row is not None:self.cell=[]
              def handle_data(self,d):
                  self.text.append(d)
                  if self.cell is not None:self.cell.append(d)
              def handle_endtag(self,tag):
                  if tag in ("td","th") and self.cell is not None:
                      self.row.append(" ".join("".join(self.cell).split()));self.cell=None
                  elif tag=="tr" and self.row is not None:
                      self.rows.append(self.row);self.row=None
          with urllib.request.urlopen(urls[series],timeout=30) as r:
              final=r.geturl()
              assert urllib.parse.urlparse(final).scheme=="https" and urllib.parse.urlparse(final).hostname=="www.federalreserve.gov"
              raw=r.read(4_000_001)
          assert 0<len(raw)<=4_000_000
          p=Tables();p.feed(raw.decode("utf-8",errors="strict"))
          text=" ".join(" ".join(p.text).split())
          match=re.search(r"Release date:\s*([A-Za-z]+\s+\d{1,2},\s+2026)",text,re.I)
          assert match,"missing release identity"
          released=datetime.strptime(match.group(1),"%B %d, %Y").date()
          now=datetime.now(timezone.utc)
          assert now.date().isoformat()=="2026-11-26" and datetime(2026,11,19).date()<=released<now.date(),"source vintage not admissible"
          if series=="H41":
              candidates=[r for r in p.rows if len(r)==5 and r[0].lower()=="total assets" and re.fullmatch(r"\(0\)",r[1])]
              assert len(candidates)==1,"ambiguous H41 consolidated statement"
              values=[int(candidates[0][2].replace(",","").replace(" ",""))]
              assert 1_000_000<values[0]<20_000_000
              label="H41 consolidated total assets Wednesday level; USD millions"
          else:
              candidates=[r for r in p.rows if len(r)==6 and r[0].lower().startswith("discount window primary credit")]
              assert len(candidates)==1,"ambiguous H15 primary credit"
              values=[float(v) for v in candidates[0][1:]]
              assert all(0<=v<=30 for v in values)
              label="H15 primary credit rate; percent; latest displayed five cells"
          result={"series":series,"label":label,"source":final,"release_date":released.isoformat(),"retrieved_at":now.isoformat(),"source_sha256":hashlib.sha256(raw).hexdigest(),"values":values,"scope":"source access and current vintage only; no event admission or historical archive verification","inference_calls":0,"outcomes_scored":0}
          Path("source-probe.json").write_text(json.dumps(result,sort_keys=True))
          print("G3_PRIMARY_SOURCE="+json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g3-primary-${{ matrix.series }}
          path: source-probe.json
          if-no-files-found: error
