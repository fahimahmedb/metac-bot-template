name: F2 distinct alternative routes metadata only
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/nostream_availability_preflight.yaml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        provider: [openrouter]
    steps:
      - name: Read provider metadata without generation
        env:
          PROVIDER: ${{ matrix.provider }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 -I - <<'PY'
          import json,os,urllib.request,urllib.error
          from decimal import Decimal
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          op=urllib.request.build_opener(NoRedirect)
          def get(url,header=None,key=None):
              headers={"Accept":"application/json"}
              if header and key:headers[header]=key
              try:
                  with op.open(urllib.request.Request(url,headers=headers,method="GET"),timeout=20) as r:
                      return json.loads(r.read(8_000_000))
              except urllib.error.HTTPError as e:return {"http":e.code}
              except Exception as e:return {"error":type(e).__name__}
          def zero(p):
              try:return all(k in p for k in ("prompt","completion")) and all(Decimal(str(v))==0 for v in p.values())
              except Exception:return False
          mode=os.environ["PROVIDER"]
          out={"provider":mode,"inference_calls":0}
          if mode=="openrouter":
              key=os.getenv("OPENROUTER_API_KEY")
              if not key:raise SystemExit("BLOCK missing own OpenRouter key")
              base="https://openrouter.ai/api/v1"
              for endpoint in ("key","credits"):
                  d=get(base+"/"+endpoint,"Authorization","Bearer "+key).get("data",{})
                  out[endpoint]={k:d[k] for k in ("is_free_tier","usage","total_credits","total_usage","free_model_daily_requests") if k in d}
              catalog=get(base+"/models").get("data",[])
              out["free_catalog"]=[{"id":m["id"],"context":m.get("context_length"),"max_completion":m.get("top_provider",{}).get("max_completion_tokens")} for m in catalog if m.get("id","").endswith(":free") and zero(m.get("pricing",{}))]
              models=["particle-ai/particle-1:free","recursive/flint-v1.0:free","inclusionai/ling-3.2-flash:free","nvidia/nemotron-3.5-super-vl:free"]
              out["exact_endpoints"]=[]
              for model in models:
                  d=get(base+"/models/"+model+"/endpoints","Authorization","Bearer "+key)
                  data=d.get("data",{})
                  out["exact_endpoints"].append({"requested":model,"returned":data.get("id"),"http":d.get("http"),"zero_endpoints":[e.get("tag") or e.get("provider_slug") for e in data.get("endpoints",[]) if data.get("id")==model and zero(e.get("pricing",{}))]})
          elif mode=="google":
              key=os.getenv("GEMINI_API_KEY")
              if not key:raise SystemExit("BLOCK missing own Gemini key")
              out["models"]=[]
              for m in ("gemma-4-26b-a4b-it","gemma-4-31b-it"):
                  d=get("https://generativelanguage.googleapis.com/v1beta/models/"+m,"x-goog-api-key",key)
                  out["models"].append({"requested":m,**{k:d[k] for k in ("name","inputTokenLimit","outputTokenLimit","supportedGenerationMethods","http","error") if k in d}})
          else:
              out["credential_presence"]={k:bool(os.getenv(k)) for k in ("GROQ_API_KEY","NVIDIA_API_KEY","CEREBRAS_API_KEY")}
              key=os.getenv("GROQ_API_KEY")
              if key:
                  d=get("https://api.groq.com/openai/v1/models","Authorization","Bearer "+key)
                  out["groq_models"]=[{"id":m.get("id"),"context":m.get("context_window"),"active":m.get("active")} for m in d.get("data",[])]
              key=os.getenv("CEREBRAS_API_KEY")
              if key:
                  d=get("https://api.cerebras.ai/v1/models/gpt-oss-120b","Authorization","Bearer "+key)
                  out["cerebras"]={k:d[k] for k in ("id","http","error") if k in d}
          print("AVAILABILITY_METADATA="+json.dumps(out,sort_keys=True))
          PY
