name: F3 durable provider credential and model metadata
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/nostream_availability_preflight.yaml']
permissions:
  contents: read
jobs:
  metadata:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        provider: [groq, cloudflare]
    steps:
      - name: Presence and authenticated model metadata only
        env:
          PROVIDER: ${{ matrix.provider }}
          GROQ_API_KEY: ${{ matrix.provider == 'groq' && secrets.GROQ_API_KEY || '' }}
          CLOUDFLARE_API_TOKEN: ${{ matrix.provider == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ matrix.provider == 'cloudflare' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        run: |
          python3 -I - <<'PY'
          import json,os,re,urllib.request,urllib.error,urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          mode=os.environ["PROVIDER"]
          r={"provider":mode,"inference_calls":0,"free_tier_verified":False,"live_admitted":False,"status":"BLOCK_MISSING_CREDENTIAL","metadata_requests":0}
          if mode=="groq":
              key=os.getenv("GROQ_API_KEY")
              url="https://api.groq.com/openai/v1/models/openai/gpt-oss-120b"
              expected="openai/gpt-oss-120b"
          else:
              key=os.getenv("CLOUDFLARE_API_TOKEN")
              account=os.getenv("CLOUDFLARE_ACCOUNT_ID","")
              r["account_id_present"]=bool(account)
              if not re.fullmatch(r"[0-9a-fA-F]{32}",account):key=None
              url="https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/models/search?search="+urllib.parse.quote("gpt-oss-120b")
              expected="@cf/openai/gpt-oss-120b"
          r["credential_present"]=bool(os.getenv("GROQ_API_KEY" if mode=="groq" else "CLOUDFLARE_API_TOKEN"))
          if key:
              r["metadata_requests"]=1
              r["status"]="BLOCK_METADATA"
              try:
                  req=urllib.request.Request(url,headers={"Authorization":"Bearer "+key,"Accept":"application/json"},method="GET")
                  with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as resp:
                      raw=resp.read(2_000_001)
                      if len(raw)>2_000_000:raise ValueError("oversize")
                      d=json.loads(raw);r["http"]=resp.status
                  models=[d] if mode=="groq" else d.get("result",[])
                  if mode=="cloudflare" and d.get("success") is not True:models=[]
                  exact=[m for m in models if m.get("id" if mode=="groq" else "name")==expected]
                  if len(exact)==1 and exact[0].get("active",True) is not False:
                      r["model"]=expected;r["status"]="METADATA_PASS_BILLING_UNKNOWN"
              except urllib.error.HTTPError as e:r["http"]=e.code
              except Exception as e:r["error_type"]=type(e).__name__
          print("DURABLE_PROVIDER_METADATA="+json.dumps(r,sort_keys=True))
          PY
