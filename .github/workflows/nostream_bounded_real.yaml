name: No-Stream bounded real integration
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/nostream_bounded_real.yaml']
permissions:
  contents: read
concurrency:
  group: nostream-bounded-real-once
  cancel-in-progress: false
jobs:
  real:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: No-Stream/nostreambot-metaculus-bot
          ref: 79c1d7a1192a00724646ab05c67f3b776d2d7b65
          path: upstream
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: upstream
        run: uv sync --dev --frozen
      - name: Prepare pinned safe runner
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "79c1d7a1192a00724646ab05c67f3b776d2d7b65"
          cp research/nostream_runner.py research/nostream_bounded_real.py upstream/
          cd upstream
          uv run --frozen python -m py_compile nostream_bounded_real.py
      - name: One bounded real test with own credentials only
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          NATIVE_SEARCH_ENABLED: 'false'
          FINANCIAL_DATA_ENABLED: 'false'
          GEMINI_SEARCH_ENABLED: 'false'
          GAP_FILL_ENABLED: 'false'
          GAP_FILL_V2_ENABLED: 'false'
          PREDICTION_MARKETS_ENABLED: 'false'
          RESOLUTION_SOURCE_ENABLED: 'false'
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: 'false'
          TS_ANCHOR_ENABLED: 'false'
          TS_ANCHOR_CHART_ENABLED: 'false'
          PROBABILISTIC_TOOLS_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          NUMERIC_STACKING_ENABLED: 'false'
          PERSIST_RESEARCH_ENABLED: 'false'
          RAW_RESEARCH_LOG_ENABLED: 'false'
        run: uv run --frozen python nostream_bounded_real.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nostream-bounded-real-evidence
          path: |
            upstream/bounded-results/ledger.json
            upstream/bounded-results/summary.json
            upstream/bounded-results/evidence.sha256
          if-no-files-found: warn
