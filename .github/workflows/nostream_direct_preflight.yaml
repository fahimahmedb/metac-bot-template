name: No-Stream independent free API availability
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/nostream_direct_preflight.yaml']
permissions:
  contents: read
jobs:
  credentials:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify newly provisioned credentials and read model metadata only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 -I - <<'PY'
          import os,json,urllib.request,urllib.error
          names=("GEMINI_API_KEY","GOOGLE_API_KEY","BAIDU_API_KEY","QIANFAN_API_KEY","GROQ_API_KEY","CEREBRAS_API_KEY","NVIDIA_API_KEY")
          print("DIRECT_CREDENTIAL_PRESENCE="+json.dumps({n:bool(os.getenv(n)) for n in names},sort_keys=True))
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          checks=[
              ("GEMINI_API_KEY","https://generativelanguage.googleapis.com/v1beta/models/gemma-4-31b-it","x-goog-api-key","gemma-4-31b-it"),
              ("CEREBRAS_API_KEY","https://api.cerebras.ai/v1/models/gpt-oss-120b","Authorization","gpt-oss-120b")]
          for name,url,header,model in checks:
              key=os.getenv(name)
              if not key:
                  print("DIRECT_MODEL="+json.dumps({"credential":name,"model":model,"status":"missing"}))
                  continue
              try:
                  with opener.open(urllib.request.Request(url,headers={header:("Bearer "+key if header=="Authorization" else key),"Accept":"application/json"}),timeout=20) as r:
                      data=json.load(r)
                      out={"credential":name,"model":model,"http":r.status,"returned_id":data.get("name",data.get("id")),"inputTokenLimit":data.get("inputTokenLimit"),"outputTokenLimit":data.get("outputTokenLimit"),"supportedGenerationMethods":data.get("supportedGenerationMethods"),"context_length":data.get("context_length"),"max_completion_tokens":data.get("max_completion_tokens")}
                      print("DIRECT_MODEL="+json.dumps(out))
              except urllib.error.HTTPError as e:
                  print("DIRECT_MODEL="+json.dumps({"credential":name,"model":model,"http":e.code}))
              except Exception as e:
                  print("DIRECT_MODEL="+json.dumps({"credential":name,"model":model,"error":type(e).__name__}))
          PY
