name: No-Stream F0 zero-credit qualification
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/nostream_free_f0.yaml']
permissions:
  contents: read
concurrency:
  group: nostream-free-f0-once
  cancel-in-progress: false
jobs:
  real:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: No-Stream/nostreambot-metaculus-bot
          ref: 79c1d7a1192a00724646ab05c67f3b776d2d7b65
          path: upstream
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: upstream
        run: uv sync --dev --frozen
      - name: Prepare pinned safe runner
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "79c1d7a1192a00724646ab05c67f3b776d2d7b65"
          cp research/nostream_runner.py research/nostream_free_f0.py upstream/
          cd upstream
          uv run --frozen python -m py_compile nostream_free_f0.py
      - name: Offline safety regression checks (no real key)
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: dummy-offline
        run: |
          uv run --frozen python - <<'PY'
          from unittest.mock import patch
          import nostream_free_f0 as f
          with patch.object(f, "request", side_effect=AssertionError("network forbidden")):
              for m in f.ALLOW:
                  p=f.payload_for(m,"test")
                  assert p["model"].endswith(":free")
                  assert not p["provider"]["allow_fallbacks"]
                  assert all(v==0 for v in p["provider"]["max_price"].values())
                  assert not any(k in p for k in ("models","tools","plugins"))
              for m in ("openai/gpt-6.1-sol","openrouter/free","nvidia/other:free"):
                  try: f.invoke_sync(m,"test")
                  except f.StopBudget: pass
                  else: raise AssertionError("unapproved route")
              f.stopped=True
              try: f.invoke_sync(f.ROSTER[0],"test")
              except f.StopBudget: pass
              else: raise AssertionError("stop not enforced")
              assert not f.ledger
          print("F0_OFFLINE_GUARDS_PASS")
          PY
      - name: One F0 real test with own free credentials only
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          NATIVE_SEARCH_ENABLED: 'false'
          FINANCIAL_DATA_ENABLED: 'false'
          GEMINI_SEARCH_ENABLED: 'false'
          GAP_FILL_ENABLED: 'false'
          GAP_FILL_V2_ENABLED: 'false'
          PREDICTION_MARKETS_ENABLED: 'false'
          RESOLUTION_SOURCE_ENABLED: 'false'
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: 'false'
          TS_ANCHOR_ENABLED: 'false'
          TS_ANCHOR_CHART_ENABLED: 'false'
          PROBABILISTIC_TOOLS_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          NUMERIC_STACKING_ENABLED: 'false'
          PERSIST_RESEARCH_ENABLED: 'false'
          RAW_RESEARCH_LOG_ENABLED: 'false'
        run: uv run --frozen python nostream_free_f0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nostream-free-f0-evidence
          path: |
            upstream/free-results/ledger.json
            upstream/free-results/summary.json
            upstream/free-results/evidence.sha256
          if-no-files-found: warn
