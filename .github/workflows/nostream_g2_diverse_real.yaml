name: No-Stream F2 G2 D06 bounded recovery
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/nostream_g2_diverse_real.yaml']
permissions:
  contents: read
  actions: read
concurrency:
  group: nostream-free-f0-once
  cancel-in-progress: false
jobs:
  real:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case_id: D06
            question_type: binary
            evidence_run: 45520535838
            snapshot_sha256: 1d8421df4bf505688db85cbbc645ec5a60c47240bcfb81c04a62eb6424f4248c
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: No-Stream/nostreambot-metaculus-bot
          ref: 79c1d7a1192a00724646ab05c67f3b776d2d7b65
          path: upstream
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Reuse pinned engine and frozen dependencies
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "79c1d7a1192a00724646ab05c67f3b776d2d7b65"
          cp research/nostream_runner.py research/nostream_free_f0.py research/nostream_free_f2.py research/g2_diverse_cases.json research/g2_diverse_evidence.py upstream/
          cd upstream
          uv sync --dev --frozen
          uv run --frozen python -m py_compile nostream_free_f2.py
      - name: Offline transport and publication guard checks
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: dummy-offline
        run: |
          uv run --frozen python - <<'PY'
          from unittest.mock import patch
          import asyncio
          import nostream_free_f2 as x
          assert len(set(x.ROSTER))==3 and x.UTIL not in x.ROSTER
          assert x.ROUTES[x.GEM][1]==x.ROUTES[x.UTIL][1]
          for role,(provider,model,cap) in x.ROUTES.items():
              url,p=x.direct_payload(role,"public")
              assert url.startswith("https://api.cerebras.ai/v1/" if provider=="cerebras" else "https://generativelanguage.googleapis.com/v1beta/models/")
              assert not any(k in p for k in ("tools","plugins","models"))
              assert cap<=24576
          assert x.ROUTES[x.GPT][2]==16384
          for m in (*x.ROSTER,x.UTIL): x.f.GeneralLlm(model=m,allowed_tries=1)
          with patch.object(x.f,"get_meta",side_effect=AssertionError("network forbidden")):
              try: asyncio.run(x.main())
              except x.f.StopBudget: pass
              else: raise AssertionError("missing authorization gate")
          import io
          from urllib.error import HTTPError
          def err(code,headers=None):
              return HTTPError("https://generativelanguage.googleapis.com",code,"test",headers or {},io.BytesIO(b"{}"))
          rec={}
          with patch.object(x,"direct_request",side_effect=[err(503),err(503),({"ok":True},{})]) as req,patch.object(x.time,"sleep") as sleep:
              assert x.bounded_direct_request(x.GEM,"same",rec)==({"ok":True},{})
              assert req.call_count==3 and [a["http"] for a in rec["dispatches"]]==[503,503,200]
              assert [a.args[0] for a in sleep.call_args_list]==[10,25]
          for role,code,headers in ((x.GEM,429,{}),(x.GEM,403,{}),(x.GPT,503,{}),(x.UTIL,503,{}),(x.GEM,503,{"Retry-After":"120"})):
              with patch.object(x,"direct_request",side_effect=err(code,headers)) as req,patch.object(x.time,"sleep") as sleep:
                  try: x.bounded_direct_request(role,"same",{})
                  except HTTPError: pass
                  else: raise AssertionError("unexpected retry")
                  assert req.call_count==1 and not sleep.called
          with patch.object(x,"direct_request",side_effect=err(503)) as req,patch.object(x.time,"sleep"):
              try: x.bounded_direct_request(x.GEM,"same",{})
              except HTTPError: pass
              else: raise AssertionError("retry cap failed")
              assert req.call_count==3
          import hashlib
          with patch.dict(x.completed,{x.GEM:(hashlib.sha256(b"same").hexdigest(),"validated content")}),patch.object(x,"direct_request",side_effect=AssertionError("duplicate dispatch")) as req:
              assert x.invoke_direct(x.GEM,"same")=="validated content"
              try: x.invoke_direct(x.GEM,"different")
              except x.f.StopBudget: pass
              else: raise AssertionError("different prompt accepted")
              assert req.call_count==0
          print("F2_RETRY_GUARDS_PASS")
          print("F2_OFFLINE_PASS: exact roles, payload restrictions, model constructors and authorization gate")
          PY
      - name: Offline typed fixtures and validators
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: dummy-offline
          NOSTREAM_G2: "true"
          NOSTREAM_QUESTION_TYPE: ${{ matrix.question_type }}
        run: |
          uv run --frozen python - <<'PY'
          from types import SimpleNamespace as S
          import nostream_free_f2 as x
          q=x.build_question()
          if x.QUESTION_TYPE=="multiple_choice":
              good=S(predicted_options=[S(option_name=n,probability=1/3) for n in q.options]); bad=S(predicted_options=[S(option_name=n,probability=.7) for n in q.options])
          elif x.QUESTION_TYPE=="numeric":
              good=S(cdf=[S(percentile=i/200) for i in range(201)]); bad=S(cdf=[S(percentile=1-i/200) for i in range(201)])
          else: good=.5; bad=True
          assert x.typed_value(good,q) is not None
          try: x.typed_value(bad,q)
          except ValueError: pass
          else: raise AssertionError("invalid typed prediction accepted")
          # Regression: valid transport + absent strict block must reach upstream
          # repair, not become a transport failure or consume a second dispatch.
          import asyncio,json,tempfile
          from pathlib import Path
          from unittest.mock import patch
          from metaculus_bot.value_extraction import extract_mc
          from metaculus_bot.structured_output_schema import parse_structured_block
          if x.QUESTION_TYPE=="multiple_choice":
              raw=json.dumps({"question_type":"multiple_choice","option_probs":dict(zip(q.options,[.2,.3,.5]))})
              assert parse_structured_block(raw,"multiple_choice") is None
              response={"model":"gpt-oss-120b","id":"offline","choices":[{"finish_reason":"stop","message":{"content":raw}}],"usage":{}}
              headers={"x-ratelimit-limit-requests-minute":5,"x-ratelimit-limit-tokens-minute":30000,"x-ratelimit-limit-tokens-day":1000000}
              with tempfile.TemporaryDirectory() as tmp,patch.object(x,"OUT",Path(tmp)),patch.object(x,"direct_request",return_value=(response,headers)) as req:
                  assert x.invoke_direct(x.GPT,"fixture")==raw
                  assert x.invoke_direct(x.GPT,"fixture")==raw
                  assert req.call_count==1
                  assert x.DIRECT[-1]["strict_block_valid"] is False
              result=asyncio.run(extract_mc(raw,list(q.options),None))
              assert result.rung=="repair"
              x.typed_value(result.value.option_list,q)
          assert x.G2_GOOGLE_SOCKET_TIMEOUT==300
          print("G2_EXTRACTION_REGRESSION_PASS")
          print("G2_TYPED_OFFLINE_PASS",x.QUESTION_TYPE)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: diverse-${{ matrix.case_id }}-snapshot
          run-id: ${{ matrix.evidence_run }}
          github-token: ${{ github.token }}
          path: upstream/diverse-input
      - name: Offline diverse budget and immutable evidence gates
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: dummy-offline
          NOSTREAM_G2: 'true'
          NOSTREAM_QUESTION_TYPE: ${{ matrix.question_type }}
          NOSTREAM_DIVERSE_CASE: ${{ matrix.case_id }}
          NOSTREAM_DIVERSE_SNAPSHOT_SHA256: ${{ matrix.snapshot_sha256 }}
          NOSTREAM_CEREBRAS_NO_RECHARGE_ATTESTED: 'true'
        run: |
          uv run --frozen python - <<'PY'
          import os
          from unittest.mock import patch
          import nostream_free_f2 as x
          q,evidence,digest=x.load_diverse_input()
          assert digest==os.environ["NOSTREAM_DIVERSE_SNAPSHOT_SHA256"]
          assert q.id_of_question==990010+int(x.DIVERSE_CASE[1:])
          for role in (x.UTIL,x.UTIL,x.GEM,x.GPT):
              x.admit_diverse_dispatch(role)
          assert len(x.DIRECT_DISPATCHES)==4
          for role in x.ROUTES:
              try:x.admit_diverse_dispatch(role)
              except x.f.StopBudget:pass
              else:raise AssertionError("fifth direct dispatch accepted")
          x.DIRECT_DISPATCHES.clear()
          for role in (x.GEM,x.GEM,x.GEM,x.GPT):x.admit_diverse_dispatch(role)
          assert len(x.DIRECT_DISPATCHES)==4
          with patch.dict(os.environ,{"NOSTREAM_DIVERSE_SNAPSHOT_SHA256":"bad"}):
              try:x.load_diverse_input()
              except x.f.StopBudget:pass
              else:raise AssertionError("wrong snapshot accepted")
          with patch.dict(os.environ,{"NOSTREAM_CEREBRAS_NO_RECHARGE_ATTESTED":"false"}):
              try:x.load_diverse_input()
              except x.f.StopBudget:pass
              else:raise AssertionError("missing no-recharge attestation accepted")
          print("DIVERSE_BUDGET_AND_SNAPSHOT_PASS",x.DIVERSE_CASE,digest)
          PY
      - name: One bounded real G2 diverse trial
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NOSTREAM_F2_AUTHORIZED: 'true'
          NOSTREAM_G2: 'true'
          NOSTREAM_QUESTION_TYPE: ${{ matrix.question_type }}
          NOSTREAM_CEREBRAS_TRIAL_AUTHORIZED: 'true'
          NOSTREAM_CEREBRAS_NO_RECHARGE_ATTESTED: 'true'
          NOSTREAM_DIVERSE_CASE: ${{ matrix.case_id }}
          NOSTREAM_DIVERSE_SNAPSHOT_SHA256: ${{ matrix.snapshot_sha256 }}
          NATIVE_SEARCH_ENABLED: 'false'
          FINANCIAL_DATA_ENABLED: 'false'
          GEMINI_SEARCH_ENABLED: 'false'
          GAP_FILL_ENABLED: 'false'
          GAP_FILL_V2_ENABLED: 'false'
          PREDICTION_MARKETS_ENABLED: 'false'
          RESOLUTION_SOURCE_ENABLED: 'false'
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: 'false'
          TS_ANCHOR_ENABLED: 'false'
          TS_ANCHOR_CHART_ENABLED: 'false'
          PROBABILISTIC_TOOLS_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          NUMERIC_STACKING_ENABLED: 'false'
          PERSIST_RESEARCH_ENABLED: 'false'
          RAW_RESEARCH_LOG_ENABLED: 'false'
        run: uv run --frozen python nostream_free_f2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nostream-diverse-${{ matrix.case_id }}-recovery-evidence
          path: upstream/free-results/
          if-no-files-found: warn
