name: No-Stream resource parity preflight
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/nostream_preflight.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: No-Stream/nostreambot-metaculus-bot
          ref: 79c1d7a1192a00724646ab05c67f3b776d2d7b65
          path: upstream
          persist-credentials: false
      - name: Verify pinned source and run free metadata preflight
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OAI_ANTH_OPENROUTER_KEY: ${{ secrets.OAI_ANTH_OPENROUTER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          EXA_API_KEY: ${{ secrets.exa_key }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_CONTACT_EMAIL: ${{ secrets.SEC_EDGAR_CONTACT_EMAIL }}
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "79c1d7a1192a00724646ab05c67f3b776d2d7b65"
          python3 -I research/nostream_preflight.py
