name: One-shot sandbox proof (no live tournament)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/futureeval-evidence-protocol-20261122

permissions:
  contents: read

concurrency:
  group: futureeval-sandbox-proof
  cancel-in-progress: false

jobs:
  sandbox-forecast:
    # Only a manual dispatch or a commit with the exact tag runs this job.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[futureeval-sandbox]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Credential presence preflight (never print values)
        run: uv run python -c "from bot_helpers import check_environment; check_environment(strict=True)"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Submit only to Metaculus bot-testing-area
        run: uv run python main.py --mode test_questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
