name: Second blinded holdout (research only)

on:
  push:
    branches: [research/historical-blind-calibration]
    paths:
      - "research/second_holdout.py"
      - "research/test_second_holdout.py"
      - ".github/workflows/second_holdout.yaml"

permissions:
  contents: read

concurrency:
  group: second-blinded-holdout
  cancel-in-progress: false

jobs:
  evaluate:
    if: contains(github.event.head_commit.message, '[second-holdout]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify blinded-input and temporal-split invariants
        run: |
          python -m compileall -q research
          python -m unittest discover -s research -p "test_*.py" -v
      - name: Install statistical learning dependencies
        run: pip install 'scikit-learn==1.7.2' 'numpy==2.2.6' 'scipy==1.15.3' 'joblib==1.5.2' 'threadpoolctl==3.6.0'
      - name: Fetch immutable-by-hash archive
        run: |
          curl --fail --location --retry 2 --max-time 300 --max-filesize 300000000 \
            "https://www.forecastbench.org/assets/data/processed-forecast-sets/processed_forecast_sets.tar.gz" \
            -o /tmp/forecastbench-processed.tar.gz
          echo '3b3b9630f2ccf4da401e703266a116cdc7de535eabb4cb44c9a10d1c01315b0f  /tmp/forecastbench-processed.tar.gz' | sha256sum -c -
      - name: Fit and evaluate frozen candidates on new holdout
        run: python research/second_holdout.py /tmp/forecastbench-processed.tar.gz
      - name: Upload aggregate metrics and snapshot hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-holdout-report
          path: second_holdout_report.json
          if-no-files-found: ignore
