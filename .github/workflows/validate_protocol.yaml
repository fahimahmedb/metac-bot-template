name: Validate autonomous forecasting protocol

on:
  pull_request:
    paths:
      - main.py
      - forecasting_protocol.py
      - tests/test_forecasting_protocol.py
      - publication_guard.py
      - .github/workflows/run_bot_on_tournament.yaml
      - .github/workflows/run_bot_on_metaculus_cup.yaml
      - .github/workflows/test_bot.yaml
      - .github/workflows/check_bot_credentials.yaml
      - .github/workflows/validate_protocol.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-protocol-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m compileall -q main.py forecasting_protocol.py publication_guard.py tests/test_forecasting_protocol.py
      - name: Offline protocol assertions
        run: python -m unittest discover -s tests -p "test_forecasting_protocol.py" -v
