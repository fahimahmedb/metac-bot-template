# INERT TEMPLATE: do not copy into .github/workflows until new UTC window,
# fresh quota and owner admission verified. Maximum 24 model dispatches.
name: F3 six-event diverse technical qualification
on:
  push:
    branches: [research/historical-blind-calibration]
    paths: ['.github/workflows/g2_f3_diverse_live_once.yaml']
permissions:
  contents: read
  actions: read
concurrency:
  group: nostream-free-f0-once
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed on duplicate workflow or retry and wrong UTC window
        run: |
          test "$GITHUB_RUN_NUMBER" = 1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(date -u +%F)" = "2026-11-27"
          echo "F3_ONCE_GUARD_PASS run=$GITHUB_RUN_ID number=$GITHUB_RUN_NUMBER attempt=$GITHUB_RUN_ATTEMPT"
  real:
    needs: admission
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case: F304
            reference_sha256: 41e6928b01bffabeb52a86030264f35d916fd5999befb04393f7ee62efcd3414
            question_type: multiple_choice
            source: D02
            evidence_run: 45520535838
            artifact: diverse-D02-snapshot
          - case: F310
            reference_sha256: 43a5e79e85ec931b909dd3a742bf0c4f779d909f7d8387f813edef47394a797c
            question_type: numeric
            source: treasury
            evidence_run: 45737456249
            artifact: f3-primary-treasury-F310
          - case: F306
            reference_sha256: 6b452282a1b10183cd3f7c2c7b9c456d1bb698a0b7c199828de1b7d4034974e7
            question_type: binary
            source: D06
            evidence_run: 45520535838
            artifact: diverse-D06-snapshot
          - case: F307
            reference_sha256: 9430e1c444dfff53da6a20e734f274a20aeda193eccda6f18f3385968d62de4c
            question_type: binary
            source: D01
            evidence_run: 45522593032
            artifact: diverse-D01-snapshot
          - case: F308
            reference_sha256: 963df03e2f55965eeb4eadcd95272772a6fe5af2e2078eef0e4d2c496ad3ad29
            question_type: numeric
            source: D03
            evidence_run: 45522593032
            artifact: diverse-D03-snapshot
          - case: F309
            reference_sha256: c6c2d7969e3014c7a99e7782e865bd8a6cf9619cfb2f5c1e69f257fcb6fd79ea
            question_type: multiple_choice
            source: D05
            evidence_run: 45520535838
            artifact: diverse-D05-snapshot
    steps:
      - name: Enforce new UTC quota window before setup
        run: test "$(date -u +%F)" = "2026-11-27"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: No-Stream/nostreambot-metaculus-bot
          ref: 79c1d7a1192a00724646ab05c67f3b776d2d7b65
          path: upstream
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Install pinned engine and local adapter
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "79c1d7a1192a00724646ab05c67f3b776d2d7b65"
          cp research/nostream_runner.py research/nostream_free_f0.py research/nostream_free_f2.py research/nostream_free_f3.py research/g2_f3_treasury_snapshot.py research/g2_diverse_cases.json research/g2_diverse_evidence.py research/g3_baseline_probe.py research/historical_calibration.py research/f3_reference_freeze.py upstream/
          cd upstream
          uv sync --dev --frozen
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.evidence_run }}
          github-token: ${{ github.token }}
          path: upstream/diverse-input
      - uses: actions/download-artifact@v4
        with:
          name: frozen-f3-reference-${{ matrix.case }}
          run-id: 45740139669
          github-token: ${{ github.token }}
          path: upstream/frozen-reference
      - name: Verify pre-inference comparator identity (no real credentials)
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: dummy-offline
          NOSTREAM_G2: 'true'
          NOSTREAM_QUESTION_TYPE: ${{ matrix.question_type }}
          NOSTREAM_F3_CASE: ${{ matrix.case }}
          REFERENCE_SHA: ${{ matrix.reference_sha256 }}
        run: uv run --frozen python f3_reference_freeze.py --verify frozen-reference/f3-reference.json "$REFERENCE_SHA"
      - name: One bounded F3 native event trial
        working-directory: upstream
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOSTREAM_CEREBRAS_TRIAL_AUTHORIZED: 'true'
          NOSTREAM_CEREBRAS_NO_RECHARGE_ATTESTED: 'true'
          NOSTREAM_F3_LIVE_AUTHORIZED: 'true'
          NOSTREAM_F3_DIVERSE_AUTHORIZED: 'true'
          NOSTREAM_G2: 'true'
          NOSTREAM_QUESTION_TYPE: ${{ matrix.question_type }}
          NOSTREAM_F3_CASE: ${{ matrix.case }}
          NATIVE_SEARCH_ENABLED: 'false'
          FINANCIAL_DATA_ENABLED: 'false'
          GEMINI_SEARCH_ENABLED: 'false'
          GAP_FILL_ENABLED: 'false'
          GAP_FILL_V2_ENABLED: 'false'
          PREDICTION_MARKETS_ENABLED: 'false'
          RESOLUTION_SOURCE_ENABLED: 'false'
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: 'false'
          TS_ANCHOR_ENABLED: 'false'
          TS_ANCHOR_CHART_ENABLED: 'false'
          PROBABILISTIC_TOOLS_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          NUMERIC_STACKING_ENABLED: 'false'
          PERSIST_RESEARCH_ENABLED: 'false'
          RAW_RESEARCH_LOG_ENABLED: 'false'
        run: uv run --frozen python nostream_free_f3.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-diverse-${{ matrix.case }}-receipt
          path: upstream/free-results/
          if-no-files-found: warn
  finalize:
    needs: [admission, real]
    if: always() && needs.admission.result == 'success' && github.run_number == 1 && github.run_attempt == 1
    uses: ./.github/workflows/f3_campaign_finalize.yaml
    with:
      cohort: diverse
      source_run: ${{ format('{0}', github.run_id) }}
      source_head: ${{ github.sha }}
  project:
    needs: [admission, real, finalize]
    if: always() && needs.admission.result == 'success' && github.run_number == 1 && github.run_attempt == 1
    uses: ./.github/workflows/f3_receipt_projection.yaml
    with:
      cohort: diverse
      source_run: ${{ format('{0}', github.run_id) }}
      source_head: ${{ github.sha }}
      final_run: ${{ format('{0}', github.run_id) }}
      final_head: ${{ github.sha }}
